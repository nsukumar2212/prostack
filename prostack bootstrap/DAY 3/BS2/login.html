<html>
<head>
    <title>Bootstrap Login Forms</title>

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

<div class="container mt-5">

    <div class="row">

        <!-- Form 1 -->
        <div class="col-3 border p-3">

            <div class="mb-3">
                <label>Email Id:</label>
                <input type="text"
                       class="form-control"
                       placeholder="Enter Email">
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password"
                       class="form-control"
                       placeholder="Enter Password">
            </div>

            <button class="btn btn-success">
                Login

        </div>

        <!-- Form 2 -->
        <div class="col-3">

            <div class="mb-3">
                <label>Email Id:</label>
                <input type="text"
                       class="form-control"
                       placeholder="Enter Email">
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password"
                       class="form-control"
                       placeholder="Enter Password">
            </div>

            <button class="btn btn-success">
                Login
            </button>

        </div>

        <!-- Form 3 -->
        <div class="col-3">

            <input type="text"
                   class="form-control mb-3"
                   placeholder="Enter Email">

            <input type="password"
                   class="form-control mb-3"
                   placeholder="Enter Password">

            <button class="btn btn-success">
                Login
            </button>

        </div>

        <!-- Form 4 -->
        <div class="col-3">

            <div class="card">

                <div class="card-header bg-primary text-white">
                    Login Details
                </div>

                <div class="card-body">

                    <div class="mb-3">
                        <label>Email Id:</label>
                        <input type="text"
                               class="form-control"
                               placeholder="Enter Email">
                    </div>

                    <div class="mb-3">
                        <label>Password</label>
                        <input type="password"
                               class="form-control"
                               placeholder="Enter Password">
                    </div>

                    <button class="btn btn-success">
                        Login
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
