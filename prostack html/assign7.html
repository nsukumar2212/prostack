<html>
    <head>
        <h1> Shipping Address </h1>
    </head>
<body>
    <input type="tel"/> : Phone Number <br><br>
    <input type="text"/> : Company <br><br>
    <label> Country </label>
    <select>
        <option value="india"> india </option>
        <option value="australia"> australia </option>
        <option value="usa"> usa </option>
    </select>
    <input type="text"/> : Address Finder <br><br>
    <input type="text"/> : Street Address <br><br>
    <input type="text"/> : Suburb <br><br>
    <input type="number"/> : Postal Code <br><br>
    <input type="checkbox"/> : Save in address book <br><br>
    <input type="button" value="Save"/> 
    <input type="reset" value="cancel"/> 

</body>
</html>
